import java.time.Duration

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.avast.gradle.docker-compose' version '0.17.10'
	id 'org.flywaydb.flyway' version '10.15.2'
}

group = 'com.group'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Default created by template
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// External deps (importing by anh em dev)
	implementation 'org.slf4j:slf4j-api:2.0.9'
	implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.16'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
	implementation 'org.springframework.data:spring-data-commons:4.1.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'com.google.googlejavaformat:google-java-format:1.36.1'
	implementation 'org.apache.commons:commons-collections4:4.4'


	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-rest-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

flyway {
	url = 'jdbc:postgresql://localhost:5432/travels'
	user = 'travels-user'
	password = 'travels-password'
	schemas = ['public']
	locations = ['filesystem:src/main/resources/db/migration']
}

dockerCompose {
	useComposeFiles = ['src/main/docker/compose/docker-compose.yml']
	stopContainers = true
	removeContainers = true
	waitForTcpPorts = true
	waitForTcpPortsTimeout = Duration.ofMinutes(2)
}

tasks.register('startTestEnv') {
	group = 'environment'
	description = 'Start local dev environment (Exported by docker compose)'
	dependsOn tasks.composeUp
}

tasks.register('stopTestEnv') {
	group = 'environment'
	description = 'Stop dev environment'
	dependsOn tasks.composeDown
}

tasks.register('resetTestEnv') {
	group = 'environment'
	description = 'Kill and recreate local dev env'
	dependsOn tasks.composeDown
	finalizedBy tasks.composeUp
}

bootRun {
	args = ['--spring.profiles.active=local']
}

tasks.named('bootRun') {
	dependsOn tasks.named('startTestEnv')
}
