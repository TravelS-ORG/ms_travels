import java.time.Duration


plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.avast.gradle.docker-compose' version '0.17.10'
	id 'org.flywaydb.flyway' version '10.15.2'
}

group = 'com.group'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Default created by template
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// External deps (importing by anh em dev)
	implementation 'org.slf4j:slf4j-api:2.0.9'
	implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.16'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
	implementation 'org.springframework.data:spring-data-commons:4.1.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'com.google.googlejavaformat:google-java-format:1.36.1'
	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.5.7'
	implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.4'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.16'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.16'
//	implementation 'com.bucket4j:bucket4j-core:8.10.1'
//	implementation 'com.bucket4j;bucket4j-redis:8.10.1'
//	implementation 'io.github.resilience4j:resilience4j-spring-boot:3.2.0'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-rest-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

def envMode = (project.findProperty("envMode") ?: "single").toString()

def composeBase = "src/main/docker/compose/docker-compose.yml"
def composeRedis = "src/main/docker/compose/components/docker-compose.redis.yml"
def composePostgresSingle = "src/main/docker/compose/components/docker-compose.postgres.yml"
def composePostgresReplica = "src/main/docker/compose/components/docker-compose.replica.yml"
def composeKeycloak = "src/main/docker/compose/components/docker-compose.keycloak.yml"

dockerCompose {
        useComposeFiles = [composeBase, composeRedis, composePostgresSingle]
        stopContainers = true
        removeContainers = true
        waitForTcpPorts = true
        waitForTcpPortsTimeout = Duration.ofMinutes(2)
}

tasks.named("composeUp").configure {
        doFirst {
                dockerCompose.useComposeFiles = (envMode == "multiple")
                        ? [composeBase, composeRedis, composePostgresReplica]
                        : [composeBase, composeRedis, composePostgresSingle]
        }
}

tasks.named("composeDown").configure {
        doFirst {
                dockerCompose.useComposeFiles = (envMode == "multiple")
                        ? [composeBase, composeRedis, composePostgresReplica]
                        : [composeBase, composeRedis, composePostgresSingle]
        }
}

tasks.register('startTestEnv') {
        group = 'environment'
        description = 'Start local dev environment (single|multiple)'
        dependsOn 'composeUp'
}

tasks.register('stopTestEnv') {
        group = 'environment'
        description = 'Stop local dev environment (single|multiple)'
        dependsOn 'composeDown'
}

tasks.register('resetTestEnv') {
        group = 'environment'
        description = 'Recreate local dev environment (single|multiple)'
        dependsOn 'composeDown'
        finalizedBy 'composeUp'
}

bootRun {
	args = ['--spring.profiles.active=local']
}

tasks.named('bootRun') {
	dependsOn tasks.named('startTestEnv')
}
