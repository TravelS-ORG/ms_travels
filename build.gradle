plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '10.15.2'
}

group = 'com.group'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	implementation 'org.slf4j:slf4j-api:2.0.9'
	implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.16'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
	implementation 'org.springframework.data:spring-data-commons:4.1.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'com.google.googlejavaformat:google-java-format:1.36.1'
	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.5.7'
	implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.4'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.16'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.16'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-rest-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

flyway {
	url = 'jdbc:postgresql://localhost:5432/travels'
	user = 'travels-user'
	password = 'travels-password'
	schemas = ['public']
	locations = ['filesystem:src/main/resources/db/migration']
}


// ============================================================================
// Docker Compose
// ============================================================================
def dockerExecutable = 'docker'

def composeBase = file('src/main/docker/compose/docker-compose.yml').absolutePath
def composeRedis = file('src/main/docker/compose/components/docker-compose.redis.yml').absolutePath
def composePostgresSingle = file('src/main/docker/compose/components/docker-compose.postgres.yml').absolutePath
def composePostgresReplica = file('src/main/docker/compose/components/docker-compose.replica.yml').absolutePath

def envMode = (project.findProperty('envMode') ?: 'single').toString()

if (!['single', 'multiple'].contains(envMode)) {
	throw new GradleException(
			"Invalid envMode '${envMode}'. Expected 'single' or 'multiple'."
	)
}

def selectedComposeFiles = envMode == 'multiple'
		? [composeBase, composeRedis, composePostgresReplica]
		: [composeBase, composeRedis, composePostgresSingle]


def composeArgs = { List<String> files, List<String> command ->
	def args = ['compose']

	files.each { file ->
		args.addAll(['-f', file])
	}

	args.addAll(command)
	args
}


// ============================================================================
// Low-level Compose Tasks
// ============================================================================
def composeUpTask = tasks.register('composeUp', Exec) {
	group = 'environment'
	description = "Start Docker Compose environment in '${envMode}' mode"

	executable = dockerExecutable
	args composeArgs(
			selectedComposeFiles,
			[
					'up',
					'-d',
					'--build',
					'--remove-orphans',
					'--wait',
					'--wait-timeout', '120'
			]
	)
}


def registerComposeDown = { String taskName, List<String> composeFiles ->

	tasks.register(taskName, Exec) {
		group = 'environment'

		executable = dockerExecutable
		args composeArgs(
				composeFiles,
				[
						'down',
						'-v',
						'--remove-orphans'
				]
		)

		ignoreExitValue = true
	}
}


def composeDownSingleTask = registerComposeDown(
		'composeDownSingle',
		[
				composeBase,
				composeRedis,
				composePostgresSingle
		]
)

def composeDownReplicaTask = registerComposeDown(
		'composeDownReplica',
		[
				composeBase,
				composeRedis,
				composePostgresReplica
		]
)

composeDownReplicaTask.configure {
	mustRunAfter composeDownSingleTask
}

composeUpTask.configure {
	mustRunAfter composeDownSingleTask, composeDownReplicaTask
}


// ============================================================================
// Environment Lifecycle Tasks
// ============================================================================

def startTestEnvTask = tasks.register('startTestEnv') {
	group = 'environment'
	description = "Clean previous environments and start '${envMode}' mode"

	dependsOn(
			composeDownSingleTask,
			composeDownReplicaTask,
			composeUpTask
	)
}

tasks.register('stopTestEnv') {
	group = 'environment'
	description = 'Stop all local test environments'

	dependsOn(
			composeDownSingleTask,
			composeDownReplicaTask
	)
}


tasks.register('resetTestEnv') {
	group = 'environment'
	description = "Recreate local environment in '${envMode}' mode"

	// startTestEnv already:
	// down single -> down replica -> up selected mode
	dependsOn startTestEnvTask
}


// ============================================================================
// Spring Boot
// ============================================================================

bootRun {
	args = ['--spring.profiles.active=local']
}

tasks.named('bootRun') {
	dependsOn startTestEnvTask
}